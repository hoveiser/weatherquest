<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="WeatherQuest logo">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1F3A"/>
      <stop offset="1" stop-color="#0A0E27"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B35"/>
      <stop offset="0.5" stop-color="#C24A8E"/>
      <stop offset="1" stop-color="#6B46C1"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#FF6B35"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- rounded glass tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glass)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#brand)" stroke-width="6" opacity="0.9"/>

  <!-- shield outline (gaming element) -->
  <path d="M256 84 L404 132 V262 C404 350 340 410 256 436 C172 410 108 350 108 262 V132 Z"
        fill="none" stroke="url(#brand)" stroke-width="10" opacity="0.55" stroke-linejoin="round"/>

  <!-- neon W -->
  <path d="M138 168 L196 168 L232 300 L256 214 L280 300 L316 168 L374 168 L312 372 L272 372 L256 320 L240 372 L200 372 Z"
        fill="url(#brand)" filter="url(#glow)"/>

  <!-- lightning bolt cutting through -->
  <path d="M272 120 L214 268 L252 268 L226 392 L306 232 L264 232 Z"
        fill="url(#bolt)" stroke="#fff3d6" stroke-width="4" stroke-linejoin="round" filter="url(#glow)" opacity="0.97"/>
</svg>
