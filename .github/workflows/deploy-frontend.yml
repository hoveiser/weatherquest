name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        # The app uses HashRouter + a relative Vite base, so the bundle works
        # directly at the project-page mount point (/repo/) with no extra config.
        #
        # VITE_CONTRACT_ADDRESS is a PUBLIC on-chain address (StudioNet) baked into
        # the bundle so that, once a player connects a wallet, complete_level settles
        # for real on-chain. We deliberately do NOT set VITE_ONCHAIN=true: the campaign
        # path only needs the address (wallet.mode=="onchain" && CONTRACT), and flipping
        # VITE_ONCHAIN would make the marketplace create/submit flows throw (they have
        # no funded escrow). A public address is safe to commit here.
        #
        # This is the campaign-payout contract redeployed with native GEN payouts.
        # Payouts reach the player's wallet as real native GEN via a
        # @gl.evm.contract_interface emit_transfer (the earlier
        # gl.get_contract_at(eoa) pattern silently no-oped against EOAs), and
        # complete_level also mirrors each payout in an on-chain per-address credit
        # ledger (get_credit). Verified on StudioNet: a passing complete_level moved
        # the wallet's native balance by exactly the payout (docs/final_verify.json).
        # The action judgment now also gates on relevance, so gibberish / off-topic
        # text is rejected even on a Low tier (single LLM call, exact consensus
        # preserved). The weather multiplier stays deterministic integer math, levels
        # 2-10 read a fixed coordinate table, and validators compare
        # tier/multiplier/success EXACTLY. Funded with 30+ GEN on StudioNet.
        env:
          VITE_CONTRACT_ADDRESS: "0x599EA254e19f7427Db0B158123ED1A21f28538fe"
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
