name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        # The app uses HashRouter + a relative Vite base, so the bundle works
        # directly at the project-page mount point (/repo/) with no extra config.
        #
        # VITE_CONTRACT_ADDRESS is a PUBLIC on-chain address (StudioNet) baked into
        # the bundle so that, once a player connects a wallet, complete_level settles
        # for real on-chain. We deliberately do NOT set VITE_ONCHAIN=true: the campaign
        # path only needs the address (wallet.mode=="onchain" && CONTRACT), and flipping
        # VITE_ONCHAIN would make the marketplace create/submit flows throw (they have
        # no funded escrow). A public address is safe to commit here.
        #
        # This is the campaign-payout contract redeployed with the validator-consensus
        # fix: the weather multiplier is now deterministic integer math (no LLM on the
        # payout path), levels 2-10 read a fixed coordinate table (byte-identical fetch
        # URLs), only ONE LLM call remains (action judgment), and validators compare
        # tier/multiplier/success EXACTLY. It keeps CAMPAIGN_REWARD_SCALE=100 and the
        # capped 1.20x Perfect efficiency tier, and is funded with 2 GEN on StudioNet.
        env:
          VITE_CONTRACT_ADDRESS: "0x8fc4bc489C30666D6cF846DB63aAEaDfD8475A72"
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
