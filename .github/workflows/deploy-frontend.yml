name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        # The app uses HashRouter + a relative Vite base, so the bundle works
        # directly at the project-page mount point (/repo/) with no extra config.
        #
        # VITE_CONTRACT_ADDRESS is a PUBLIC on-chain address (StudioNet) baked into
        # the bundle so that, once a player connects a wallet, complete_level settles
        # for real on-chain. We deliberately do NOT set VITE_ONCHAIN=true: the campaign
        # path only needs the address (wallet.mode=="onchain" && CONTRACT), and flipping
        # VITE_ONCHAIN would make the marketplace create/submit flows throw (they have
        # no funded escrow). A public address is safe to commit here.
        #
        # This is the campaign-payout contract redeployed with the credit-accounting
        # fix. StudioNet cannot deliver native GEN to a player EOA: every
        # emit_transfer payout produced a triggered tx that failed "Contract not
        # found" while the house balance decreased. complete_level now records the
        # exact payout in an on-chain per-address credit ledger (get_credit) and
        # leaves the house balance intact; a future EthSend-capable runner or a
        # bridge withdraws the credit to the wallet. The weather multiplier stays
        # deterministic integer math, levels 2-10 read a fixed coordinate table,
        # only ONE LLM call remains (action judgment), and validators compare
        # tier/multiplier/success EXACTLY. Funded with 30 GEN on StudioNet (covers
        # every campaign level up to the L10 max of 6 GEN).
        env:
          VITE_CONTRACT_ADDRESS: "0x2d764187A908d1677510c5E7FE69e8e7C1810299"
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
