name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        # The app uses HashRouter + a relative Vite base, so the bundle works
        # directly at the project-page mount point (/repo/) with no extra config.
        #
        # VITE_CONTRACT_ADDRESS is a PUBLIC on-chain address (StudioNet) baked into
        # the bundle so that, once a player connects a wallet, complete_level settles
        # for real on-chain. We deliberately do NOT set VITE_ONCHAIN=true: the campaign
        # path only needs the address (wallet.mode=="onchain" && CONTRACT), and flipping
        # VITE_ONCHAIN would make the marketplace create/submit flows throw (they have
        # no funded escrow). A public address is safe to commit here.
        #
        # This is the campaign-payout contract redeployed with CAMPAIGN_REWARD_SCALE=100
        # (all prize GEN divided by 100 on-chain so the small testnet house lasts ~100x
        # longer); it is funded with 20 GEN. Ratios and weather/efficiency multipliers are
        # unchanged from the prior contract.
        env:
          VITE_CONTRACT_ADDRESS: "0x1695bd0E190e4E8eC174c62678cc3d9f5A9B39a5"
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
