name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        # The app uses HashRouter + a relative Vite base, so the bundle works
        # directly at the project-page mount point (/repo/) with no extra config.
        #
        # VITE_CONTRACT_ADDRESS is a PUBLIC on-chain address (StudioNet) baked into
        # the bundle so that, once a player connects a wallet, complete_level settles
        # for real on-chain. We deliberately do NOT set VITE_ONCHAIN=true: the campaign
        # path only needs the address (wallet.mode=="onchain" && CONTRACT), and flipping
        # VITE_ONCHAIN would make the marketplace create/submit flows throw (they have
        # no funded escrow). A public address is safe to commit here.
        #
        # This bundle points at the layered-verification redeploy 0x8b317B94...
        # (deploy tx 0x46acbc553f73b45e4b87e74d6fa15964d93cc434319117954f516d6abc48dedb,
        # FINALIZED / MAJORITY_AGREE / SUCCESS; house funded with 30 GEN by tx
        # 0x0056cd40f72a7297021ba94e3ebeb69ad0949e94421e5eb1950c99a30423b3a6; evidence
        # in docs/deploy_new.json). Action verification there is three layers: a
        # deterministic pre-filter that reverts with [EXPECTED] before any LLM or
        # network work, a strict rubric whose success flag is DERIVED by the contract
        # (a model-supplied "success" key is ignored), and an on-chain LEVEL_OBJECTIVE
        # table so off-topic text fails on every tier including Low.
        # Payouts reach the wallet as real native GEN via a
        # @gl.evm.contract_interface emit_transfer, and the settlement screen now reads
        # the PER-LEVEL amount from get_level_payout(account, level) instead of the
        # cumulative get_credit total, cross-checked against the wallet's measured
        # native balance delta. The cumulative figure is only ever shown under a
        # "total credited to your address" label, and contract-wide counters moved to
        # get_global_stats so a global number cannot appear in a per-player panel.
        # The weather multiplier stays deterministic integer math, ALL levels 1-10
        # (level 1 is Istanbul) read a fixed integer coordinate table so a caller
        # cannot pick the stormiest city to boost the reward, and validators compare
        # tier/multiplier/derived success EXACTLY. There is no efficiency or step term:
        # payout = base(level) * multiplier / 100. Funded with 30 GEN.
        env:
          VITE_CONTRACT_ADDRESS: "0x8b317B94AF764e9de587805d264CbBea59Ce3aE2"
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
