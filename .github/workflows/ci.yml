name: CI — Regression Tests

# Runs the GenLayer contract lint + direct-mode test suite, and a frontend
# typecheck/build, on every push to main and every pull request.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contract:
    name: genvm-lint + direct-mode tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          # genvm-linter + pytest (see requirements.txt)
          pip install -r requirements.txt
          # GenLayer SDK + direct-mode test fixtures. The public `genlayer` 0.0.1
          # placeholder shadows the real `genlayer` module, so uninstall it first
          # (see README §7).
          pip uninstall -y genlayer || true
          pip install "genlayer-py==0.16.3" "genlayer-test==0.29.2"

      - name: Show tool versions
        run: |
          python --version
          genvm-lint --version || true
          pytest --version

      - name: genvm-lint check
        run: genvm-lint check contracts/weatherquest.py

      - name: Seed genvm SDK cache for the direct-mode harness
        # genlayer-test==0.29.2 downloads `genvm-universal.tar.xz` and resolves
        # the release tag via `releases/latest`. genvm v0.3.x renamed that asset
        # to `genvm-runners-all.tar.xz`, so the auto-resolved `latest` (v0.3.0-rcN)
        # 404s on a fresh runner and every direct-mode test errors during
        # contract load. Pin the last release that still ships `genvm-universal.tar.xz`
        # (v0.2.16) — it carries this contract's runner hash
        # `1jb45aa8...` — into the harness cache dir so it never hits the network.
        env:
          GENV_PIN: v0.2.16
        run: |
          mkdir -p "$HOME/.cache/gltest-direct"
          curl -fSL --retry 3 -o "$HOME/.cache/gltest-direct/genvm-universal-${GENV_PIN}.tar.xz" \
            "https://github.com/genlayerlabs/genvm/releases/download/${GENV_PIN}/genvm-universal.tar.xz"
          ls -lh "$HOME/.cache/gltest-direct"

      - name: Direct-mode tests
        run: pytest tests/direct/ -v

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Build (tsc -b && vite build)
        run: npm run build
